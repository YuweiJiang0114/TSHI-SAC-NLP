# One SAC agent over all areas/stages/loop flows; site NLP (IPOPT) solves the operation.
seed: 1
case: "-++"
torch_threads: 4
workers: 18
nlp: {area_mode: upper}   # the agent buys the area, the NLP may use any part of it
rules: {}              # tshi_nlp.evaluate.Rules defaults (paper Sec. 6 bounds)
budget: 30000         # site evaluations
batch: 36
warmup: 360
utd: 4
random_fraction: 0.2   # stronger exploration: 20 % random site actions per batch
policy_eval_every: 5
sac:
  hidden_dims: [256, 256]
  gamma: 0.0
  tau: 0.01
  actor_lr: 0.0003
  critic_lr: 0.001
  alpha_lr: 0.0003
  initial_alpha: 0.02
  target_entropy_per_dim: -1.5
  batch_size: 256
  replay_capacity: 100000
  log_std_min: -10.0
  log_std_max: 1.0
unused_area_weight: 10.0  # reward shaping: unused-area capital charged ten more times (training only)
stage_explore: 0.3    # stronger exploration: each existing unit's stage re-drawn with 30 % probability
hindsight: true       # also store the action that buys exactly the used areas, rewarded with the trimmed TAC
