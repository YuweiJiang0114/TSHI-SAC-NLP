# Same 80-control design problem; original unretrofitted network; no target prior.
model: paper
action_policy: dense
strict_original_search: true
residual_reference_prior: false
run_kind: original_network_parameter_tuning
seed: 2000
steps: 3000
episode_length: 50
warmup: 128
warmup_sampling: gaussian
warmup_std: 0.2
utd: 1
batch_size: 64
replay_capacity: 100000
torch_threads: 1
evaluation_rollouts: 10
progress_every: 10
env:
  stages: 3
  dt_min: 1.0
  max_time_s: 8.0
  solver_id: 3
  reconcile_installed_areas: true
  flow_max: 1000.0
  area_step: 25.0
  temperature_step: 5.0
  flow_log_step: 0.10
  fraction_step: 0.025
  neutral_loop_start: true
  bound_action_restoration: true
  thermal_initialization: generic
masac:
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0003
  entropy_coefficient: 0.005
  automatic_entropy_tuning: true
  target_entropy_per_dimension: -0.5
  log_std_min: -5.0
  log_std_max: 0.5
  initial_log_std: -1.0
